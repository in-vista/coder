<div class="item checklist-box {containerCssClass}"
     id="container_{propertyIdWithSuffix}"
     style="{style}"
     data-property-id="{propertyId}"
     data-item-id="{itemId}"
     data-item-id-encrypted="{itemIdEncrypted}"
     data-property-name="{propertyName}"
     data-language-code="{languageCode}"
     data-width="{width}"
     data-save-on-change="{saveOnChange}"
     data-label-style="{labelStyle}"
     data-label-width="{labelWidth}"
     data-input-type="checklistbox"
     data-visibility-path-regex="{visibilityPathRegex}">

    <div class="grid-loader loading">
        <div class="loader-icon">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <span class="handler">&nbsp;</span>

    <h4 class="{titleClass}">
        <label>{title}</label>
        <span class="info-link no-hover {infoIconClass}">
            <ins class="icon-info-full"></ins>
        </span>
    </h4>

    <div class="fieldSet" id="fieldSet_{propertyIdWithSuffix}" style="{elementStyle}">
        <div class="checklist-box-options" id="checklist-box_{propertyIdWithSuffix}"></div>
    </div>

    <div class="form-hint {formHintClass}">{hint}</div>
</div>
